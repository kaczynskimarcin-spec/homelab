services:
  searxng:
    image: searxng/searxng:latest
    container_name: homelab-searxng

    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}

    ports:
      - "127.0.0.1:8888:8080"

    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro

    networks:
      - database

    restart: unless-stopped

networks:
  database:
    external: true
    name: postgres_default