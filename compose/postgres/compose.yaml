services:
  postgres:
    image: postgres:18
    container_name: homelab-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: homelab
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres_data:
