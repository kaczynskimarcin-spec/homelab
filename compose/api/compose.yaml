services:
  api:
    image: homelab-api:local
    container_name: homelab-api
    env_file:
      - ../postgres/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/homelab
      SPRING_DATASOURCE_USERNAME: homelab
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: default
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - database
    restart: unless-stopped

networks:
  database:
    external: true
    name: postgres_default
